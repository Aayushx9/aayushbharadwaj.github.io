<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Aayush Bharadwaj</title>
  <meta name="description" content="The requested portfolio page could not be found.">
  <meta name="theme-color" content="#070b16">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="error-page">
  <main class="error-shell">
    <div class="error-grid" aria-hidden="true"></div>
    <a class="brand error-brand" href="./" aria-label="Back to Aayush Bharadwaj portfolio"><span class="brand-mark">AB</span><span class="brand-name">Aayush Bharadwaj</span></a>
    <div class="error-content">
      <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>OUT-OF-DISTRIBUTION SIGNAL</p>
      <h1>404</h1>
      <p class="error-message">Looks like this page wandered outside the dataset.</p>
      <a class="button button-primary" href="./">Back to portfolio <span aria-hidden="true">↗</span></a>
    </div>
    <p class="error-foot">AI / ML · DATA SCIENCE · EVALUATION</p>
  </main>
  <style>
    .error-shell { position: relative; display: grid; min-height: 100svh; padding: 38px max(24px, 6vw); overflow: hidden; place-items: center; background: radial-gradient(circle at 50% 45%, rgba(111, 78, 164, .13), transparent 30rem), #070b16; }
    .error-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(142, 166, 207, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(142, 166, 207, .035) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(circle, black, transparent 75%); }
    .error-brand { position: absolute; z-index: 1; top: 34px; left: max(24px, 6vw); }
    .error-content { position: relative; z-index: 1; text-align: center; }
    .error-content .eyebrow { display: inline-flex; align-items: center; }
    .error-content h1 { margin-top: 24px; background: linear-gradient(180deg, #f4f8ff 15%, #61718b); background-clip: text; color: transparent; font-family: var(--font-display); font-size: clamp(110px, 25vw, 260px); font-weight: 500; letter-spacing: -.09em; line-height: .85; }
    .error-message { margin-top: 36px; color: #96a5ba; font-size: clamp(16px, 2vw, 20px); }
    .error-content .button { margin-top: 30px; }
    .error-foot { position: absolute; bottom: 30px; color: #4d5c71; font-family: var(--font-display); font-size: 10px; letter-spacing: .14em; }
  </style>
</body>
</html>
